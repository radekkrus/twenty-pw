<!doctype html>
<html lang="en" translate="no" class="light">
  <head>
    <meta charset="UTF-8" />

    <link
      rel="icon"
      type="image/x-icon"
      href="/images/icons/android/android-launchericon-48-48.png"
      data-rh="true"
    />
    <link rel="apple-touch-icon" href="/images/icons/ios/192.png" />
    <link rel="manifest" href="/manifest.json" />

    <meta name="theme-color" content="#000000" />
    <meta name="description" content="A modern open-source CRM" />
    <meta
      property="og:image"
      content="https://raw.githubusercontent.com/twentyhq/twenty/main/docs/static/img/social-card.png"
    />
    <meta property="og:description" content="A modern open-source CRM" />
    <meta property="og:title" content="Twenty" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:image"
      content="https://raw.githubusercontent.com/twentyhq/twenty/main/docs/static/img/social-card.png"
    />

    <meta name="twitter:description" content="A modern open-source CRM" />
    <meta name="twitter:title" content="Twenty" />
    <title>Twenty</title>
    <!-- BEGIN: Twenty Config -->
    <script id="twenty-env-config">
      window._env_ = {
        // This will be overwritten
      };
    </script>
    <!-- END: Twenty Config -->

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content"
    />
    <script type="module">
      const disableInputAutoZoom = () => {
        const viewportMetadata = document.querySelector('meta[name=viewport]');

        if (viewportMetadata !== null) {
          viewportMetadata.setAttribute(
            'content',
            'width=device-width, initial-scale=1.0, maximum-scale=1.0, interactive-widget=resizes-content',
          );
        }
      };

      const isIOS = /iPad|iPhone/.test(navigator.userAgent);
      if (isIOS) {
        disableInputAutoZoom();
      }
    </script>
    <style>
      :root {
        /* THEME_DARK.background.secondary */
        --theme-dark-background-secondary: #1b1b1b;
        /* THEME_LIGHT.background.secondary */
        --theme-light-background-secondary: #fcfcfc;
      }

      @media (prefers-color-scheme: dark) {
        html,
        body {
          background-color: var(--theme-dark-background-secondary);
        }
      }

      @media (prefers-color-scheme: light) {
        html,
        body {
          background-color: var(--theme-light-background-secondary);
        }
      }
    </style>

    <!--
      🔴 Fork addition, not upstream. Partner Wzrostu skin and view-state runtime.

      These three files are NOT bundled. They are served by Caddy from /root/caddy/brand/
      (see infra/caddy/Caddyfile in partner-wzrostu-crm), which is deliberate: editing the
      skin or the view-state heuristics is an rsync and a hard reload, with no image build
      and no restart. Caddy caches them for 300 s.

      This replaces a `sed` in the compose entrypoint that rewrote dist/front/index.html on
      every container boot. That was best-effort by nature: if an image ever moved the
      file, the sed silently did nothing and the skin disappeared with no error anywhere.

      palyri-skin.js stamps data-pl attributes on the record drawer because Twenty builds
      it from vanilla-extract classes whose hashes move on every build, so CSS cannot
      target it directly. It only sets attributes, so React's reconciler never sees it.
    -->
    <link rel="stylesheet" id="palyri-skin" href="/brand/palyri-skin.css" />
    <script defer src="/brand/palyri-skin.js"></script>
    <script defer src="/brand/view-state.js"></script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
